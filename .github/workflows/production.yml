name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Deploy database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy --no-verify-jwt

      - name: Generate types
        run: supabase gen types typescript > types.gen.ts

      - name: Verify deployment
        run: |
          echo "🚀 Production deployment completed!"
          echo "🔗 Production URL: https://$SUPABASE_PROJECT_ID.supabase.co"
          
      - name: Notify team (optional)
        run: |
          # Add notification logic here (Slack, Discord, email, etc.)
          echo "Production deployment notification sent"
